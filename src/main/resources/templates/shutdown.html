<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Sistema Desligado</title>
</head>
<body>

<th:block layout:fragment="content">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#1DB954" class="bi bi-power" viewBox="0 0 16 16">
                            <path d="M7.5 1v7h1V1h-1z"/>
                            <path d="M3 8.812a4.999 4.999 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812z"/>
                        </svg>
                    </div>
                    <h2 class="mb-3">Sistema Encerrado</h2>
                    <p class="text-muted mb-4">
                        O serviço do Spotify Downloader foi desligado com segurança na sua máquina.
                        Você já pode fechar esta janela ou aba do navegador.
                    </p>
                    <script>
                        // Small script to optionally close the tab if the browser allows it
                        function fecharAba() {
                            window.close();
                        }
                    </script>
                    <button class="btn btn-spotify" onclick="fecharAba()">Fechar Janela</button>
                </div>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
